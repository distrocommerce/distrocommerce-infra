# Service names/ports verified for chart 10.5.0; recheck `kubectl get svc -n auth` after a chart bump.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zitadel
  namespace: auth
spec:
  parentRefs:
    - name: public
      namespace: edge
  hostnames: ["auth.localtest.me"]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /ui/v2/login
      backendRefs:
        - name: zitadel-login
          port: 3000
    - backendRefs:
        - name: zitadel
          port: 8080

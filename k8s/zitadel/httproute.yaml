# Service names/ports depend on the chart version: check `kubectl get svc -n auth`.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zitadel
  namespace: auth
spec:
  parentRefs:
    - name: public
      namespace: edge
  hostnames: ["auth.localtest.me"]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /ui/v2/login
      backendRefs:
        - name: zitadel-login
          port: 3000
    - backendRefs:
        - name: zitadel
          port: 8080

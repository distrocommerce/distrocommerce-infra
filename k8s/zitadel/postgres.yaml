# ZITADEL's own PostgreSQL, inside kind, disposable. Named zitadel-postgres on purpose:
# a Service named "postgres" would shadow the docker-compose container for pods.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zitadel-postgres
  namespace: auth
spec:
  serviceName: zitadel-postgres
  replicas: 1
  selector:
    matchLabels: {app: zitadel-postgres}
  template:
    metadata:
      labels: {app: zitadel-postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:18.6
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: zitadel-postgres
                  key: admin-password
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: zitadel-postgres
  namespace: auth
spec:
  selector: {app: zitadel-postgres}
  ports:
    - port: 5432

fullnameOverride: kps
defaultRules:
  create: false
alertmanager:
  enabled: false
kubeEtcd: {enabled: false}
kubeScheduler: {enabled: false}
kubeControllerManager: {enabled: false}
kubeProxy: {enabled: false}
# Chart 93.1.1 ships operator v0.95.1, which has no linux/arm64 images (operator and config-reloader).
# v0.95.2 has them. Drop these tags once a chart release uses v0.95.2 or later.
prometheusOperator:
  image:
    tag: v0.95.2
  prometheusConfigReloader:
    image:
      tag: v0.95.2
prometheus:
  prometheusSpec:
    retention: 3d
    # Metrics arrive from the OTel Collector over OTLP (/api/v1/otlp/v1/metrics), not remote write: OTLP keeps each
    # point's start time, and created-timestamp-zero-ingestion turns it into a 0 sample, so increase()/rate() count
    # the first requests of a new series (new pod, new route/status). Checked in the v3.16.0 source: the OTLP
    # handler passes the start time to TSDB (the feature-flag docs list only scrape protocols).
    enableOTLPReceiver: true
    # Remote write is only for Tempo's metrics generator (traces_service_graph_*), which has no OTLP output. The
    # collector does not use it. The generator writes a 0 sample before a new series' first value, so increase()
    # counts first requests; only series created in the first collection after a Tempo restart can lose that 0.
    enableRemoteWriteReceiver: true
    enableFeatures:
      - created-timestamp-zero-ingestion
    otlp:
      translationStrategy: UnderscoreEscapingWithSuffixes   # names as before: http_server_request_duration_seconds_*
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi
grafana:
  adminPassword: admin   # local only
  sidecar:
    datasources:
      name: Prometheus
      uid: prometheus   # the chart default, pinned: dashboards and links refer to it
      alertmanager:
        enabled: false   # Alertmanager is disabled above
  # Fixed UIDs (prometheus, tempo, loki) so links and dashboards do not depend on generated IDs.
  # Field names checked against the Grafana v13.3.0 source (TraceToLogsOptionsV2, TraceToMetricsOptions, Loki
  # DerivedFieldConfig). Grafana expands $VAR / ${VAR} in provisioning files, so link variables are written $${...}.
  # profile-service's OTLP logs in Loki: index label service_name; trace_id / span_id are structured metadata.
  additionalDataSources:
    - name: Tempo
      type: tempo
      uid: tempo
      access: proxy
      url: http://tempo.observability.svc.cluster.local:3200
      jsonData:
        nodeGraph:
          enabled: true
        serviceMap:
          datasourceUid: prometheus   # traces_service_graph_* from Tempo's metrics generator
        tracesToLogsV2:
          datasourceUid: loki
          spanStartTimeShift: "-1m"
          spanEndTimeShift: "1m"
          tags:
            - key: service.name
              value: service_name
          # Explicit query: trace_id is structured metadata, not part of the log line.
          customQuery: true
          query: '{$${__tags}} | trace_id="$${__span.traceId}"'
        tracesToMetrics:
          datasourceUid: prometheus
          spanStartTimeShift: "-5m"
          spanEndTimeShift: "5m"
          tags:
            - key: service.name
              value: job
          queries:
            - name: Request rate
              query: 'sum(rate(http_server_request_duration_seconds_count{$${__tags}}[$$__rate_interval]))'
            - name: p95 latency
              query: 'histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{$${__tags}}[$$__rate_interval])))'
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki.observability.svc.cluster.local:3100
      jsonData:
        derivedFields:
          - name: TraceID
            matcherType: label        # a label or structured metadata field, here trace_id
            matcherRegex: trace_id
            datasourceUid: tempo
            url: '$${__value.raw}'
            urlDisplayLabel: View trace

fullnameOverride: kps
defaultRules:
  create: false
alertmanager:
  enabled: false
kubeEtcd: {enabled: false}
kubeScheduler: {enabled: false}
kubeControllerManager: {enabled: false}
kubeProxy: {enabled: false}
# Chart 93.1.1 ships operator v0.95.1, which has no linux/arm64 images (operator and config-reloader).
# v0.95.2 has them. Drop these tags once a chart release uses v0.95.2 or later.
prometheusOperator:
  image:
    tag: v0.95.2
  prometheusConfigReloader:
    image:
      tag: v0.95.2
prometheus:
  prometheusSpec:
    retention: 3d
    # Metrics arrive from the OTel Collector over OTLP (/api/v1/otlp/v1/metrics), not remote write: OTLP keeps each
    # point's start time, and created-timestamp-zero-ingestion turns it into a 0 sample, so increase()/rate() count
    # the first requests of a new series (new pod, new route/status). Checked in the v3.16.0 source: the OTLP
    # handler passes the start time to TSDB (the feature-flag docs list only scrape protocols).
    enableOTLPReceiver: true
    enableFeatures:
      - created-timestamp-zero-ingestion
    otlp:
      translationStrategy: UnderscoreEscapingWithSuffixes   # names as before: http_server_request_duration_seconds_*
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi
grafana:
  adminPassword: admin   # local only
  sidecar:
    datasources:
      alertmanager:
        enabled: false   # Alertmanager is disabled above
  additionalDataSources:
    - name: Tempo
      type: tempo
      access: proxy
      url: http://tempo.observability.svc.cluster.local:3200
    - name: Loki
      type: loki
      access: proxy
      url: http://loki.observability.svc.cluster.local:3100

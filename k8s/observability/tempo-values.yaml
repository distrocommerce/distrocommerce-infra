# Chart grafana-community/tempo 3.2.1 (Tempo 3.1.1); keys checked with `helm show values` and `helm template`.
# The chart's default Jaeger receivers stay on: setting tempo.receivers.jaeger to null breaks its Service template.
tempo:
  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces
      wal:
        path: /var/tempo/wal
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"
persistence:
  enabled: true
  size: 5Gi

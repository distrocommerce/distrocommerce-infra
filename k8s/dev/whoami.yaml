# Prints request headers: used to verify X-User-ID injected by the JWT policy.
apiVersion: apps/v1
kind: Deployment
metadata: {name: whoami, namespace: apps}
spec:
  replicas: 1
  selector: {matchLabels: {app: whoami}}
  template:
    metadata: {labels: {app: whoami}}
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.10
          ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata: {name: whoami, namespace: apps}
spec:
  selector: {app: whoami}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: whoami, namespace: apps}
spec:
  parentRefs: [{name: public, namespace: edge}]
  hostnames: ["api.localtest.me"]
  rules:
    - backendRefs: [{name: whoami, port: 80}]

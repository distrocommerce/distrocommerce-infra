kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: distro
nodes:
  - role: control-plane
    extraPortMappings:
      # Mac 80/443 -> node ports used by the Envoy Gateway NodePort Service
      - containerPort: 30080
        hostPort: 80
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 30443
        hostPort: 443
        listenAddress: "127.0.0.1"
        protocol: TCP
